<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德州扑克 — 联机对战</title>
<link rel="stylesheet" href="../style.css">
<style>
    /* ===== 大厅样式 ===== */
    #lobbyPanel {
        max-width: 500px; margin: 60px auto; padding: 32px;
        background: #16213e; border-radius: 12px; text-align: center;
    }
    #lobbyPanel h2 { color: #4fc3f7; margin-bottom: 20px; }
    #lobbyPanel input {
        font-size: 16px; padding: 10px 14px; margin: 6px;
        background: #0a0a1a; color: #eee; border: 1px solid #333;
        border-radius: 6px; width: 200px; text-align: center;
    }
    #lobbyPanel input::placeholder { color: #555; }
    #lobbyPanel button {
        font-size: 16px; padding: 10px 24px; margin: 6px;
        background: #0f3460; color: #eee; border: none;
        border-radius: 6px; cursor: pointer;
    }
    #lobbyPanel button:hover { background: #1a5080; }
    #lobbyPanel button.primary { background: #2d6a4f; }
    #lobbyPanel button.primary:hover { background: #40916c; }
    #lobbyPanel button.danger { background: #9b2226; }
    #lobbyPanel button.danger:hover { background: #ae2012; }
    .room-code-display {
        font-size: 36px; color: #f0c040; letter-spacing: 6px;
        padding: 16px; font-family: monospace;
    }
    #playerList { margin: 12px 0; text-align: left; }
    .lobby-player {
        padding: 6px 10px; margin: 4px 0;
        background: #0a0a1a; border-radius: 4px;
        display: flex; justify-content: space-between; align-items: center;
    }
    #lobbyStatus { color: #888; margin: 8px 0; font-size: 14px; }
    .hidden { display: none !important; }
    .notice {
        margin-top: 16px; padding: 8px; background: #1a1a2e;
        border-radius: 4px; font-size: 12px; color: #888;
    }
    .notice a { color: #4fc3f7; }
    #rebuyBar {
        position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: #1a1a2e; border: 2px solid #f0c040; border-radius: 10px;
        padding: 12px 24px; display: flex; align-items: center; gap: 16px; z-index: 100;
    }
    #rebuyBar span { color: #e74c3c; font-size: 16px; font-weight: bold; }
    #rebuyBar button { font-size: 16px; padding: 10px 20px; }
</style>
</head>
<body>

<div id="app">

    <!-- 顶栏 -->
    <div id="topBar">
        <span id="topHand">第 1 手</span>
        <span class="top-sep">|</span>
        <span id="topBlinds">100/200</span>
        <span class="top-sep">|</span>
        <span id="topPot">底池: 0</span>
        <span class="top-sep">|</span>
        <span id="topRoomCode" title="点击复制房间码" style="cursor:pointer;"></span>
        <span id="topMsg">欢迎！创建或加入房间开始游戏</span>
        <button id="btnVoice" title="语音播报开关" style="background:none;border:1px solid #555;color:#aaa;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:12px;">🔊</button>
    </div>

    <!-- 大厅 -->
    <div id="lobbyPanel">
        <h2>🃏 联机对战</h2>
        <input type="text" id="inputNickname" placeholder="你的昵称" maxlength="8" value="玩家">
        <div id="createJoinRow">
            <button class="primary" id="btnCreateRoom">创建房间</button>
            <br>
            <input type="text" id="inputRoomCode" placeholder="房间码" maxlength="6" style="width:100px">
            <button id="btnJoinRoom">加入房间</button>
        </div>
        <div id="configRow" class="hidden" style="margin:12px 0;">
            <label style="color:#aaa;font-size:14px;">AI数量:
                <select id="inputAICount" style="font-size:14px;padding:4px 8px;background:#0a0a1a;color:#eee;border:1px solid #333;border-radius:4px;">
                    <option value="0">无AI</option>
                    <option value="1">1个</option>
                    <option value="2">2个</option>
                    <option value="3">3个</option>
                    <option value="4">4个</option>
                    <option value="5">5个</option>
                    <option value="6">6个</option>
                    <option value="7">7个</option>
                    <option value="8" selected>8个（满桌）</option>
                </select>
            </label>
        </div>
        <div id="rejoinRow" class="hidden">
            <button class="primary" id="btnRejoinRoom">🔄 重新加入</button>
            <button id="btnCancelRejoin">取消</button>
        </div>
        <div class="room-code-display" id="lobbyRoomCode"></div>
        <div id="lobbyStatus"></div>
        <div id="playerList"></div>
        <button class="primary hidden" id="btnStartGame">开始游戏</button>
        <button class="danger hidden" id="btnLeaveRoom">离开房间</button>
        <div class="notice">
            朋友输入房间码即可加入 | AI 自动填充空位<br>
            <a href="../">← 返回单人模式</a>
        </div>
    </div>

    <!-- 牌桌（初始隐藏） -->
    <div id="tableArea" class="hidden">
        <div id="dealerSpot">
            <div class="dealer-icon">🃏</div>
            <div class="dealer-label">荷官</div>
        </div>
        <div id="communityCards"></div>
        <div id="seatsContainer"></div>
    </div>

    <!-- 接管栏（观战者） -->
    <div id="takeoverBar" class="hidden"></div>

    <!-- 补码栏 -->
    <div id="rebuyBar" class="hidden">
        <span>💀 你被淘汰了！</span>
        <button class="primary" id="btnRebuy">💰 补码 (+20000) 全局剩余 <span id="rebuyLeft">5</span> 次</button>
    </div>

    <!-- 底部操作区（初始隐藏） -->
    <div id="actionBar" class="hidden">
        <div id="yourInfo">
            <div id="yourHand"></div>
            <div id="handHint"></div>
            <div id="yourChips">积分: 20000</div>
            <div id="yourBet"></div>
        </div>
        <div id="actionButtons">
            <button class="btn-fold" id="btnFold">弃牌</button>
            <button class="btn-check" id="btnCheck">过牌</button>
            <button class="btn-call" id="btnCall">跟注</button>
            <input type="number" id="inputRaise" placeholder="加注到" step="100" min="0" style="width:100px;padding:10px 12px;font-size:16px;border-radius:8px;border:2px solid #e65100;background:#1a1a2e;color:#ff9800;text-align:center;font-weight:bold;">
            <button class="btn-raise" id="btnRaise">加注</button>
            <button class="btn-allin" id="btnAllIn">All-in</button>
            <button class="btn-next hidden" id="btnNext">下一局 ▶</button>
            <button class="btn-leave hidden" id="btnLeaveGame">🚪 退出房间</button>
        </div>
    </div>
</div>

<!-- 回合倒计时条 -->
<div id="turnTimer"></div>

<!-- 结果弹窗 -->
<div id="resultOverlay" class="hidden">
    <div id="resultBox">
        <h2 id="resultTitle"></h2>
        <div class="winner-list" id="winnerList"></div>
        <button id="btnNextHand">下一局 ▶</button>
    </div>
</div>

<!-- 摊牌面板 -->
<div id="showdownPanel" class="hidden">
    <div class="sd-content">
        <div class="sd-title" id="sdTitle">🃏 摊牌</div>
        <div class="sd-pubcards" id="sdPubcards"></div>
        <div class="sd-players" id="sdPlayers"></div>
        <div class="sd-pot" id="sdPot"></div>
        <button class="sd-next-btn" id="sdNextBtn">下一局 ▶</button>
    </div>
</div>

<!-- 行动日志 -->
<div id="actionLog"></div>

<!-- 脚本加载 -->
<script src="/socket.io/socket.io.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/deck.js"></script>
<script src="../shared/hand_evaluator.js"></script>
<script src="../shared/pot_calculator.js"></script>
<script src="../shared/gto_ranges.js"></script>
<script src="../shared/player_factory.js"></script>
<script src="../shared/board_analyzer.js"></script>
<script src="sound.js"></script>
<script src="network.js"></script>
<script src="lobby.js"></script>
<script src="renderer.js"></script>

<script>
// ===== 倒计时 =====
let turnTimerInterval = null;
let turnSecondsLeft = 0;
const timerBar = document.getElementById('turnTimer');

function startTurnTimer(seconds) {
    clearInterval(turnTimerInterval);
    turnSecondsLeft = seconds || 30;
    timerBar.style.width = '100%';
    timerBar.classList.remove('warning');

    turnTimerInterval = setInterval(() => {
        turnSecondsLeft--;
        const pct = Math.max(0, (turnSecondsLeft / 30) * 100);
        timerBar.style.width = pct + '%';
        if (turnSecondsLeft <= 10) timerBar.classList.add('warning');
        if (turnSecondsLeft <= 0) clearInterval(turnTimerInterval);
    }, 1000);
}

function stopTurnTimer() {
    clearInterval(turnTimerInterval);
    timerBar.style.width = '0%';
    timerBar.classList.remove('warning');
}

// ===== 主入口 =====
document.addEventListener('DOMContentLoaded', () => {
    Lobby.init();
    Renderer.initSeats();
    Network.connect();

    // 房间状态更新
    Network.on('roomState', (roomState) => {
        Lobby.updatePlayerList(roomState);
    });

    // 游戏开始 → 隐藏大厅，显示牌桌
    Network.on('gameStarting', () => {
        Lobby.hide();
        stopTurnTimer();
    });

    // 游戏状态更新 → 渲染牌桌
    Network.on('stateUpdate', (state) => {
        Renderer.render(state);
        // 倒计时
        if (state.isMyTurn && state.phase !== 'hand_over') {
            startTurnTimer(30);
        } else {
            stopTurnTimer();
        }
    });

    // 游戏结束
    Network.on('gameOver', (results) => {
        document.getElementById('topMsg').textContent = '游戏结束！';
    });

    // 重连成功
    Network.on('reconnected', (res) => {
        console.log('✅ 重连成功');
        const saved = Session.load();
        if (saved) {
            document.getElementById('topRoomCode').textContent = '🏠 ' + saved.roomCode;
            document.getElementById('topRoomCode').dataset.code = saved.roomCode;
        }
        if (res.state) {
            // 直接回到游戏中
            Lobby.hide();
            Renderer.render(res.state);
        } else {
            // 回到大厅
            Lobby.show();
            Lobby._enterRoom(
                Session.load()?.roomCode || '',
                false,
                '已重新连接'
            );
        }
    });

    // 重连失败 → 显示重新加入面板
    Network.on('reconnectFailed', () => {
        const saved = Session.load();
        if (saved && saved.roomCode) {
            Lobby.showRejoinPanel(saved.roomCode, saved.nickname || '玩家');
        } else {
            document.getElementById('topMsg').textContent = '⚠️ 连接断开，请刷新页面';
        }
    });

    // 断线
    Network.on('disconnect', () => {
        document.getElementById('topMsg').textContent = '⚠️ 连接断开，尝试自动重连...';
    });

    Network.on('roomClosed', () => {
        Session.clear();
        Lobby._resetLobby();
        Lobby.show();
        document.getElementById('topMsg').textContent = '房间已关闭，所有玩家已离开';
    });

    Network.on('connectError', (err) => {
        document.getElementById('topMsg').textContent = '⚠️ 无法连接到服务器，正在自动重试...';
        console.warn('连接错误:', err.message);
    });

    Network.on('error', (err) => {
        alert('错误: ' + err.message);
    });
});

// ===== 按钮事件 =====
document.getElementById('btnFold').addEventListener('click', () => Network.sendAction('fold'));
document.getElementById('btnCheck').addEventListener('click', () => Network.sendAction('check'));
document.getElementById('btnCall').addEventListener('click', () => Network.sendAction('call'));
// 加注按钮 + 回车
function doRaise() {
    const val = parseInt(document.getElementById('inputRaise').value);
    if (val > 0) Network.sendAction('raise', val);
}
document.getElementById('btnRaise').addEventListener('click', doRaise);
document.getElementById('inputRaise').addEventListener('keydown', (e) => { if (e.key === 'Enter') doRaise(); });
document.getElementById('btnAllIn').addEventListener('click', () => Network.sendAction('allin'));
document.getElementById('btnNext').addEventListener('click', () => Network.nextHand());
// 接管按钮（动态生成，用事件委托）：支持替换AI + 加入空位
document.getElementById('takeoverBar').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    // 替换AI
    const pid = parseInt(btn.dataset.pid);
    if (pid) {
        const res = await Network.takeSeat(pid);
        if (res.error) { alert(res.error); return; }
        if (res.state) {
            document.getElementById('takeoverBar').classList.add('hidden');
            Renderer.render(res.state);
            document.getElementById('topMsg').textContent = '✅ 已入座！';
        }
        return;
    }

    // 加入空位
    const seatIdx = parseInt(btn.dataset.seat);
    if (!isNaN(seatIdx)) {
        const res = await Network.joinSeat(seatIdx);
        if (res.error) { alert(res.error); return; }
        if (res.state) {
            document.getElementById('takeoverBar').classList.add('hidden');
            Renderer.render(res.state);
            document.getElementById('topMsg').textContent = '✅ 已加入空位！获得20000积分';
        }
    }
});
// 点击房间码复制
function copyRoomCode(el) {
    const code = (el.dataset.code || el.textContent).replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    ta.style.zIndex = '-1';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        document.execCommand('copy');
        const origHTML = el.innerHTML;
        el.innerHTML = '✅ 已复制!';
        setTimeout(() => { el.innerHTML = origHTML; }, 1500);
    } catch (e) {}
    document.body.removeChild(ta);
}
document.getElementById('topRoomCode').addEventListener('click', function() { copyRoomCode(this); });
document.getElementById('lobbyRoomCode').addEventListener('click', function() { copyRoomCode(this); });
// 大厅房间码显示提示
document.getElementById('lobbyRoomCode').title = '点击复制房间码';
document.getElementById('lobbyRoomCode').style.cursor = 'pointer';

// 语音开关
document.getElementById('btnVoice').addEventListener('click', () => {
    const on = Sound.toggleVoice();
    document.getElementById('btnVoice').textContent = on ? '🔊' : '🔇';
});
document.getElementById('btnRebuy').addEventListener('click', async () => {
    const res = await Network.rebuy();
    if (res.error) { alert(res.error); return; }
    document.getElementById('topMsg').textContent = '✅ 补码成功！下一局将重新上桌';
});
document.getElementById('btnLeaveGame').addEventListener('click', () => {
    if (confirm('确定要退出房间吗？退出后需要重新加入。')) {
        Network.socket.emit('leave_room');
        Session.clear();
        Lobby._resetLobby();
        Lobby.show();
        stopTurnTimer();
    }
});
</script>

</body>
</html>
